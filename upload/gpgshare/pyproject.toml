[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpgshare"
version = "0.1.0"
description = "Encrypt and decrypt messages among collaborators using GPG."
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "python-gnupg>=0.5.2",
    "PyYAML>=6.0",
    "pyperclip>=1.9",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "textual>=0.65",
]

[project.scripts]
gpgshare = "gpgshare.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests", "tui/tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = [".."]
include = ["gpgshare*"]